<html>
<title>
Математика
</title>
<body style="background-color: lime; font-size: 30">
<button onclick="location.reload()">Нова игра</button> <p id=0></p>
<p style="text-align: center">Реши правилно задачата</p>
<p id=1 style="font-size: 50">
</p>
<button id=2 style="font-size: 50" onclick=f1()>
Реши
</button>
<p id=3 style="font-size: 50">
</p>
<img id=4 width=100 height=100>
<script>
if(sessionStorage.getItem("points")==null) sessionStorage.setItem("points",0);
var points=Number(sessionStorage.getItem("points"));
document.getElementById("0").innerHTML="Точки: "+points;
var ans;
var ok=0;
var f1=function()
{
   if(ok==1) return;
   ok=1;
   ans=prompt("Напиши твоя отговор");
   var s="Твоят отговор е "+ans;
   
   if(ans==num1+num2) 
   {
   	document.getElementById("4").src="correct.png";
   	points++;
	sessionStorage.setItem("points", points);
	document.getElementById("0").innerHTML="Точки: "+points;
	s=s+" и е верен";  
   }
   else 
   {
	document.getElementById("4").src="error.png";
	s=s+". Верният отговор е "+(num1+num2);
   }
   document.getElementById("3").innerHTML=s;
}
var num1=Math.floor(Math.random()*1000);
var num2=Math.floor(Math.random()*1000);
document.getElementById("1").innerHTML=num1+" + "+num2;
</script>
</body>
</html>
